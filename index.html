<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GITPULSE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { border-radius: 0 !important; box-sizing: border-box; }
    body {
      background: #050505;
      color: #f5f5f5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      margin: 0;
      user-select: none;
    }
    .grid-bg {
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(4px, -7px); }
    }
    @keyframes shootUp {
      0% { stroke-dashoffset: 180; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.15; }
    }
    @keyframes convergeMain {
      0% { transform: scale(1) translateY(0); opacity: 1; }
      100% { transform: scale(0.2) translateY(-220px); opacity: 0; }
    }
    .floating-card {
      animation: floatSlow 4.2s ease-in-out infinite;
      transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .flushing .floating-card {
      animation: convergeMain 0.65s cubic-bezier(0.7, 0, 0.3, 1) forwards;
    }
    .uplink-active {
      stroke-dasharray: 8 6;
      animation: shootUp 0.7s linear infinite;
    }
  </style>
</head>
<body class="grid-bg flex flex-col justify-between p-5">

  <!-- ================= TOP: GITHUB MAIN FORGE ================= -->
  <header class="z-30 flex items-center justify-between border border-neutral-800 bg-black/95 px-4 py-2.5">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 bg-white inline-block"></span>
        <span class="text-xs font-bold tracking-[0.2em] uppercase">GITHUB // MAIN</span>
      </div>
      <div class="h-3 w-[1px] bg-neutral-800"></div>
      <div id="main-commits" class="flex items-center gap-2 overflow-x-auto max-w-[30vw]">
        <span class="text-[10px] text-neutral-600 tracking-widest">WAITING FOR UNIFIED PR</span>
      </div>
    </div>

    <!-- Minimal Sharp Controls -->
    <div class="flex items-center gap-2">
      <div class="hidden xl:flex items-center gap-3.5 mr-2 text-[10px] text-neutral-500 tracking-wider">
        <span>TERM <strong id="k-term" class="text-white">1</strong></span>
        <span>HOST <strong id="k-leader" class="text-amber-400">AUTH</strong></span>
        <span>MERGES <strong id="k-merges" class="text-fuchsia-400">0</strong></span>
        <span>ADAPTED <strong id="k-adapt" class="text-sky-400">0</strong></span>
        <span>PRs <strong id="k-prs" class="text-orange-500">0</strong></span>
      </div>
      <button onclick="toggleLanDrawer()" id="lan-btn" class="border border-emerald-500/70 bg-emerald-950/20 hover:bg-emerald-950/50 text-emerald-300 px-3 py-1.5 text-[10px] tracking-widest uppercase transition">
        LAN // <span id="lan-ip-badge">127.0.0.1:8000</span>
      </button>
      <button onclick="stepSim()" class="border border-neutral-700 bg-black hover:bg-neutral-900 hover:border-white px-3 py-1.5 text-[10px] tracking-widest uppercase transition">
        + IDEA
      </button>
      <button onclick="runConflict()" class="border border-neutral-700 bg-black hover:bg-neutral-900 hover:border-fuchsia-400 text-fuchsia-300 px-3 py-1.5 text-[10px] tracking-widest uppercase transition">
        3-WAY MERGE
      </button>
      <button onclick="runSpeculation()" class="border border-neutral-700 bg-black hover:bg-neutral-900 hover:border-indigo-400 text-indigo-300 px-3 py-1.5 text-[10px] tracking-widest uppercase transition">
        3X RACE
      </button>
      <button id="auto-btn" onclick="toggleAuto()" class="border border-neutral-800 bg-black hover:border-neutral-500 text-neutral-400 px-3 py-1.5 text-[10px] tracking-widest uppercase transition">
        AUTO
      </button>
      <button onclick="flushGitHub()" class="border border-orange-500 bg-orange-600 hover:bg-orange-500 text-black font-bold px-3.5 py-1.5 text-[10px] tracking-widest uppercase transition">
        ↑ MERGE PR TO MAIN
      </button>
    </div>
  </header>

  <!-- ================= LAN HOST SETUP & AGENT CONNECT BAR ================= -->
  <section id="lan-drawer" class="hidden z-30 border-x border-b border-neutral-800 bg-black/95 px-4 py-3">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
      <!-- LAN Host CLI Join Command -->
      <div class="lg:col-span-6 flex items-center justify-between border border-neutral-800 bg-neutral-950 px-3 py-2">
        <div class="truncate mr-3">
          <div class="text-[9px] text-neutral-500 tracking-widest uppercase mb-0.5">LAN ZERO-CONFIG JOIN (UDP :9999 AUTO-DISCOVERY OR HTTP)</div>
          <code id="lan-cmd" class="text-[10px] text-emerald-400 select-all">python agent_client.py --id agent-node</code>
        </div>
        <button onclick="copyLanCmd()" id="copy-btn" class="shrink-0 border border-neutral-700 hover:border-white px-2.5 py-1 text-[9px] tracking-widest uppercase">
          COPY CMD
        </button>
      </div>

      <!-- Direct LAN Agent Registration -->
      <div class="lg:col-span-6 flex items-center gap-2">
        <input id="new-agent-id" type="text" placeholder="agent-payments" value="agent-payments"
          class="bg-neutral-950 border border-neutral-800 focus:border-white px-2.5 py-2 text-[10px] text-white outline-none w-36" />
        <input id="new-agent-mod" type="text" placeholder="services/pay.py" value="services/pay.py"
          class="bg-neutral-950 border border-neutral-800 focus:border-white px-2.5 py-2 text-[10px] text-white outline-none w-40" />
        <input id="new-agent-idea" type="text" placeholder="def verify_tx(id: str) -> bool: return True"
          class="bg-neutral-950 border border-neutral-800 focus:border-white px-2.5 py-2 text-[10px] text-white outline-none flex-1" />
        <button onclick="connectLanAgent()" class="shrink-0 border border-emerald-500 bg-emerald-500 text-black font-bold px-3 py-2 text-[10px] tracking-widest uppercase hover:bg-emerald-400 transition">
          + CONNECT AGENT
        </button>
      </div>
    </div>
  </section>


  <!-- ================= MIDDLE: THE INTERMITTENT MESH CLOUD ================= -->
  <main class="relative flex-1 my-3 flex items-center justify-center overflow-hidden">
    <svg id="scene-svg" viewBox="0 0 1200 540" preserveAspectRatio="none" class="absolute inset-0 w-full h-full pointer-events-none">
      <defs>
        <radialGradient id="cloudGlow" cx="50%" cy="48%" r="48%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
          <stop offset="65%" stop-color="#f97316" stop-opacity="0.025"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <filter id="blurGlow">
          <feGaussianBlur stdDeviation="16" />
        </filter>
      </defs>

      <ellipse cx="600" cy="255" rx="430" ry="165" fill="url(#cloudGlow)" filter="url(#blurGlow)" />

      <!-- Outer Architectural Cloud Silhouette -->
      <path id="cloud-outer"
        d="M 270 345
           L 205 345
           C 145 345, 115 300, 130 250
           C 140 210, 180 185, 225 190
           C 250 125, 330 95, 410 120
           C 465 65, 585 55, 665 105
           C 740 70, 845 95, 885 160
           C 955 155, 1025 195, 1035 255
           C 1045 310, 995 345, 935 345
           Z"
        fill="rgba(14, 14, 14, 0.72)"
        stroke="#262626"
        stroke-width="1.5" />

      <!-- Inner Dashed Technical Cloud Boundary -->
      <path
        d="M 280 333
           L 215 333
           C 162 333, 135 295, 148 252
           C 158 218, 192 198, 232 202
           C 256 142, 332 112, 408 135
           C 462 82, 578 72, 655 120
           C 728 88, 828 110, 868 172
           C 935 168, 1002 204, 1012 255
           C 1020 302, 978 333, 922 333
           Z"
        fill="none"
        stroke="#404040"
        stroke-width="0.75"
        stroke-dasharray="4 6" />

      <g id="beams-layer"></g>
    </svg>

    <!-- Cloud Center Watermark Label -->
    <div class="pointer-events-none z-0 text-center">
      <div class="text-[10px] tracking-[0.35em] text-neutral-600 uppercase">
        AST MERKLE CLOUD // <span id="merkle-badge" class="text-neutral-500">00000000</span>
      </div>
      <div id="cloud-status" class="text-[9px] tracking-[0.2em] text-neutral-700 uppercase mt-1">
        CAUSAL VECTOR GOSSIP &amp; 3-WAY AST SYNTHESIS
      </div>
    </div>

    <!-- Floating Ideas & Git Diffs Inside the Cloud -->
    <div id="cloud-field" class="absolute inset-0 z-10 pointer-events-none"></div>
  </main>


  <!-- ================= BOTTOM: AGENTS ROW ================= -->
  <footer id="agents-row" class="z-20 grid gap-3"></footer>


  <script>
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    let autoTimer = null;
    let flushingAnim = false;
    let unmergedItems = [];
    let mergedPRs = [];
    let hostUrl = location.origin;

    const CLOUD_SLOTS = [
      { left: '16%', top: '34%' },
      { left: '34%', top: '19%' },
      { left: '53%', top: '17%' },
      { left: '70%', top: '26%' },
      { left: '24%', top: '50%' },
      { left: '46%', top: '46%' },
      { left: '66%', top: '49%' },
      { left: '38%', top: '33%' },
    ];

    ws.onmessage = (event) => {
      const state = JSON.parse(event.data);
      if (state.lan) {
        hostUrl = state.lan.url;
        document.getElementById('lan-ip-badge').innerText = `${state.lan.ip}:${state.lan.port}`;
        document.getElementById('lan-cmd').innerText = `python agent_client.py --server ${state.lan.url} --id agent-peer`;
      }
      updateKPIs(state.metrics, state.cluster);
      processDAG(state.dag);
      renderBeams(state.nodes, state.beam);
      renderCloudField();
      renderAgents(state.nodes);
    };

    function getAgentX(idx, total) {
      const span = 960;
      const start = 120;
      if (total <= 1) return 600;
      return Math.round(start + (idx * (span / (total - 1))));
    }

    function updateKPIs(m, cluster) {
      if (cluster) {
        document.getElementById('k-term').innerText = cluster.term;
        document.getElementById('k-leader').innerText = cluster.leader_id.replace('agent-', '').toUpperCase();
        document.getElementById('merkle-badge').innerText = cluster.merkle_root;
      }
      document.getElementById('k-merges').innerText = m.ast_merges_completed || 0;
      document.getElementById('k-adapt').innerText = m.conflicts_auto_resolved;
      document.getElementById('k-prs').innerText = m.atomic_github_pushes;
    }

    function processDAG(dag) {
      if (!dag) return;
      mergedPRs = dag.filter(c => c.kind === 'EPOCH-FLUSH' && c.git_sha);
      const mainBar = document.getElementById('main-commits');
      if (mergedPRs.length === 0) {
        mainBar.innerHTML = `<span class="text-[10px] text-neutral-600 tracking-widest">WAITING FOR UNIFIED PR</span>`;
      } else {
        mainBar.innerHTML = mergedPRs.slice(-5).reverse().map(pr => `
          <div onclick="rollback('${pr.commit_id}')" title="Click to rollback to ${pr.git_sha}"
            class="cursor-pointer border border-orange-500/70 bg-orange-950/30 px-2 py-0.5 text-[10px] text-orange-300 flex items-center gap-1.5 hover:bg-orange-500 hover:text-black transition shrink-0">
            <span class="font-bold">PR #${pr.git_sha}</span>
            <span class="opacity-75">T${pr.term}</span>
          </div>
        `).join('');
      }

      let lastFlushIdx = -1;
      for (let i = dag.length - 1; i >= 0; i--) {
        if (dag[i].kind === 'EPOCH-FLUSH') {
          lastFlushIdx = i;
          break;
        }
      }
      unmergedItems = dag.slice(lastFlushIdx + 1);
    }

    function renderBeams(nodes, beam) {
      const layer = document.getElementById('beams-layer');
      let svg = '';

      const flushing = beam && beam.kind === 'flush';
      [420, 600, 780].forEach(x => {
        svg += `<line x1="${x}" y1="100" x2="600" y2="0"
          stroke="${flushing ? '#f97316' : '#1f1f1f'}"
          stroke-width="${flushing ? 2.5 : 1}"
          class="${flushing ? 'uplink-active' : ''}" />`;
      });

      const nodeList = Object.values(nodes);
      nodeList.forEach((n, idx) => {
        const x = getAgentX(idx, nodeList.length);
        const active = beam && beam.source === n.agent_id;
        if (!n.online) {
          svg += `
            <line x1="${x}" y1="540" x2="${x}" y2="430" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" />
            <line x1="${x-6}" y1="424" x2="${x+6}" y2="436" stroke="#ef4444" stroke-width="1.5" />
            <line x1="${x+6}" y1="424" x2="${x-6}" y2="436" stroke="#ef4444" stroke-width="1.5" />
          `;
        } else {
          const stroke = active ? '#ffffff' : (n.is_leader ? '#f59e0b' : '#262626');
          const width = active ? 2.2 : (n.is_leader ? 1.4 : 1);
          const cls = active ? 'uplink-active' : '';
          svg += `<line x1="${x}" y1="540" x2="${x}" y2="345" stroke="${stroke}" stroke-width="${width}" class="${cls}" />`;
        }
      });

      if (unmergedItems.length > 1) {
        const pts = [
          [280, 210], [450, 155], [640, 145], [830, 185], [350, 285], [580, 265], [790, 280]
        ];
        for (let i = 0; i < Math.min(unmergedItems.length - 1, pts.length - 1); i++) {
          const [x1, y1] = pts[i];
          const [x2, y2] = pts[i + 1];
          svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,0.14)" stroke-width="0.8" stroke-dasharray="2 4" />`;
        }
      }

      layer.innerHTML = svg;

      const status = document.getElementById('cloud-status');
      if (beam) {
        if (beam.kind === 'flush') {
          status.innerText = 'COORDINATOR COMPACTING ALL CLOUD DIFFS → 1 ATOMIC GITHUB PR';
          status.className = 'text-[9px] tracking-[0.2em] text-orange-400 uppercase mt-1';
        } else if (beam.kind === 'local') {
          status.innerText = `${beam.source.toUpperCase()} // PRIVATE AST BODY DIFF (0 BYTES BROADCAST)`;
          status.className = 'text-[9px] tracking-[0.2em] text-emerald-400 uppercase mt-1';
        } else if (beam.kind === 'gossip') {
          status.innerText = `${beam.source.toUpperCase()} // MERKLE DELTA & CALL-SITE AST REWRITE GOSSIPED`;
          status.className = 'text-[9px] tracking-[0.2em] text-sky-400 uppercase mt-1';
        } else if (beam.kind === 'buffered') {
          status.innerText = `${beam.source.toUpperCase()} // LINK SEVERED — HOLDING IN CRDT OUTBOX`;
          status.className = 'text-[9px] tracking-[0.2em] text-red-400 uppercase mt-1';
        }
      }
    }

    function renderCloudField() {
      const field = document.getElementById('cloud-field');
      if (flushingAnim) {
        field.classList.add('flushing');
      } else {
        field.classList.remove('flushing');
      }

      const visible = unmergedItems.slice(-8);
      field.innerHTML = visible.map((item, idx) => {
        const slot = CLOUD_SLOTS[idx % CLOUD_SLOTS.length];
        const delay = (idx * 0.45).toFixed(2);

        let border = 'border-neutral-700';
        let tagColor = 'text-neutral-400';
        let tag = 'DIFF';
        if (item.kind === 'PRIVATE-AST') {
          border = 'border-emerald-500/70';
          tagColor = 'text-emerald-400';
          tag = 'LOCAL AST';
        } else if (item.kind === 'CONTRACT-GOSSIP') {
          border = 'border-sky-400/80';
          tagColor = 'text-sky-300';
          tag = 'CONTRACT';
        } else if (item.kind === 'AST-3WAY-MERGE') {
          border = 'border-fuchsia-400';
          tagColor = 'text-fuchsia-300';
          tag = '3-WAY MERGE';
        } else if (item.kind === 'HOST-FAILOVER') {
          border = 'border-amber-400';
          tagColor = 'text-amber-300';
          tag = 'FAILOVER';
        } else if (item.kind === 'SPECULATIVE-WIN') {
          border = 'border-indigo-400';
          tagColor = 'text-indigo-300';
          tag = '3X WINNER';
        } else if (item.kind === 'OFFLINE-BUFFER') {
          border = 'border-red-500';
          tagColor = 'text-red-400';
          tag = 'QUEUED';
        } else if (item.kind === 'AGENT-JOIN' || item.kind === 'GOSSIP-IDEA') {
          border = 'border-emerald-400';
          tagColor = 'text-emerald-300';
          tag = 'LAN PEER';
        }

        const diffLines = (item.diff || '+ ast_mutation()').split('\n').slice(0, 2).map(line => {
          const c = line.startsWith('-') ? 'text-red-400' : 'text-emerald-400';
          return `<div class="${c} truncate">${escapeHtml(line)}</div>`;
        }).join('');

        return `
          <div onclick="rollback('${item.commit_id}')"
            title="Click to rollback mesh to #${item.commit_id}"
            style="left: ${slot.left}; top: ${slot.top}; animation-delay: ${delay}s;"
            class="floating-card pointer-events-auto cursor-pointer absolute w-56 bg-black/95 border ${border} p-2.5 shadow-2xl hover:border-white transition">
            <div class="flex justify-between items-center text-[9px] tracking-widest uppercase mb-1">
              <span class="text-white font-bold">${item.agent_id.replace('agent-', '')}</span>
              <span class="${tagColor}">${tag} #${item.commit_id.slice(0, 4)}</span>
            </div>
            <div class="text-[10px] text-neutral-300 truncate mb-1.5">${escapeHtml(item.intent)}</div>
            <div class="bg-neutral-950 border border-neutral-900 px-1.5 py-1 text-[9px] font-mono leading-tight">
              ${diffLines}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAgents(nodes) {
      const container = document.getElementById('agents-row');
      const list = Object.values(nodes);
      container.style.gridTemplateColumns = `repeat(${Math.max(1, list.length)}, minmax(0, 1fr))`;

      container.innerHTML = list.map(n => {
        const shortName = n.agent_id.replace('agent-', '').toUpperCase();
        const sig = n.symbols && n.symbols[0] ? n.symbols[0].signature : n.target_module;
        const onlineBorder = n.online
          ? (n.is_leader ? 'border-amber-500/80' : 'border-neutral-800 hover:border-neutral-600')
          : 'border-red-600 bg-red-950/10';

        const vcStr = Object.entries(n.vector_clock).map(([k, v]) => `${k.replace('agent-', '')[0]}:${v}`).join(' ');

        return `
          <div class="border ${onlineBorder} bg-black/95 p-3 flex flex-col justify-between transition">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-1.5 truncate">
                <span class="w-1.5 h-1.5 shrink-0 ${n.online ? 'bg-emerald-400' : 'bg-red-500 animate-ping'}"></span>
                <span class="text-xs font-bold tracking-[0.15em] truncate">${shortName}</span>
                ${n.is_leader ? `<span class="text-[9px] bg-amber-500 text-black font-bold px-1 py-0.2 tracking-widest shrink-0">HOST T${n.term}</span>` : ''}
                <span class="text-[10px] text-neutral-600 truncate">${n.target_module}</span>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                ${n.outbox_size > 0 ? `<span class="text-[9px] bg-red-950 text-red-300 border border-red-700 px-1 py-0.5">Q:${n.outbox_size}</span>` : ''}
                <button onclick="sendQuickIdea('${n.agent_id}')" title="Send Idea up to Cloud"
                  class="border border-neutral-800 text-neutral-400 hover:border-white hover:text-white px-1.5 py-0.5 text-[9px] tracking-widest uppercase transition">
                  ↑
                </button>
                <button onclick="togglePartition('${n.agent_id}')"
                  class="border ${n.online ? 'border-neutral-800 text-neutral-400 hover:border-red-500 hover:text-red-400' : 'border-red-500 text-red-300 bg-red-950/40'} px-2 py-0.5 text-[9px] tracking-widest uppercase transition">
                  ${n.online ? (n.is_leader ? 'KILL HOST' : 'LINKED') : 'REJOIN'}
                </button>
              </div>
            </div>

            <div class="bg-neutral-950 border border-neutral-900 px-2 py-1.5 mb-2 flex justify-between items-center text-[10px]">
              <span class="text-sky-300 truncate">${escapeHtml(sig)}</span>
              <span class="text-neutral-600 ml-2 shrink-0">M:${n.merkle_root.slice(0, 6)}</span>
            </div>

            <div class="flex justify-between items-center text-[9px] text-neutral-500 tracking-wider uppercase">
              <span class="truncate max-w-[65%]">${escapeHtml(n.intent)}</span>
              <span class="text-neutral-400">[${vcStr}] Δ${n.local_micro_commits}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function toggleLanDrawer() {
      const el = document.getElementById('lan-drawer');
      el.classList.toggle('hidden');
    }

    function copyLanCmd() {
      const cmd = document.getElementById('lan-cmd').innerText;
      navigator.clipboard.writeText(cmd);
      const btn = document.getElementById('copy-btn');
      btn.innerText = 'COPIED';
      setTimeout(() => { btn.innerText = 'COPY CMD'; }, 1200);
    }

    async function connectLanAgent() {
      const id = document.getElementById('new-agent-id').value.trim() || `agent-${Math.floor(Math.random()*900+100)}`;
      const mod = document.getElementById('new-agent-mod').value.trim() || `services/${id.replace('agent-','')}.py`;
      const codeInput = document.getElementById('new-agent-idea').value.trim();
      const code = codeInput || `def ${id.replace('-', '_')}_handler(payload: dict) -> bool:\n    return True\n`;

      await fetch('/api/agents/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          agent_id: id,
          role: 'LAN Peer Agent',
          target_module: mod,
          initial_code: code
        })
      });
    }

    async function sendQuickIdea(agentId) {
      await fetch('/api/agents/gossip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          agent_id: agentId,
          intent: `Speculative AST update from ${agentId}`,
          gossip_message: `def sync_${Math.floor(Math.random()*99)}() -> bool: return True`
        })
      });
    }

    async function stepSim() { await fetch('/api/step', { method: 'POST' }); }
    async function runConflict() { await fetch('/api/conflict', { method: 'POST' }); }
    async function runSpeculation() { await fetch('/api/speculate', { method: 'POST' }); }
    async function togglePartition(id) { await fetch(`/api/partition/${id}`, { method: 'POST' }); }
    async function rollback(cid) { await fetch(`/api/rollback/${cid}`, { method: 'POST' }); }

    async function flushGitHub() {
      flushingAnim = true;
      renderCloudField();
      setTimeout(async () => {
        await fetch('/api/flush', { method: 'POST' });
        flushingAnim = false;
      }, 420);
    }

    function toggleAuto() {
      const btn = document.getElementById('auto-btn');
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        btn.innerText = 'AUTO';
        btn.className = 'border border-neutral-800 bg-black hover:border-neutral-500 text-neutral-400 px-3 py-1.5 text-[10px] tracking-widest uppercase transition';
      } else {
        stepSim();
        autoTimer = setInterval(stepSim, 1800);
        btn.innerText = 'AUTO: ON';
        btn.className = 'border border-emerald-500 bg-emerald-950/30 text-emerald-300 px-3 py-1.5 text-[10px] tracking-widest uppercase transition';
      }
    }
  </script>
</body>
</html>
